# run offline checks on mac
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: false
      - name: Install jvpilot and test tools
        run: |
          uv venv --python 3.12
          uv pip install -e . pip 'setuptools>=77' packaging pyyaml
      - name: Run offline tests
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Python compilation
        run: .venv/bin/python -m compileall -q app scripts tests
      - name: Build package
        run: uv build --no-sources
